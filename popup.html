<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>NPTEL Whisperer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }
    body { 
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      width: 330px; 
      padding: 14px; 
      margin: 0;
      background-color: #ffffff;
      color: #1f2937;
    }
    
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #f3f4f6;
    }

    .title {
      font-size: 13px;
      font-weight: 700;
      color: #111827;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .version-badge {
      font-size: 10px;
      background-color: #f3f4f6;
      color: #6b7280;
      padding: 2px 6px;
      border-radius: 9999px;
      font-weight: 600;
    }
    
    .card {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }

    .setting { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      font-size: 12px;
      font-weight: 500;
    }
    
    label {
      cursor: pointer;
      user-select: none;
      color: #374151;
    }
    
    input[type="checkbox"] {
      accent-color: #2563eb;
      width: 16px;
      height: 16px;
      cursor: pointer;
      margin: 0;
    }

    .diag-btn {
      width: 100%;
      padding: 8px 12px;
      background-color: #1e293b;
      color: #f8fafc;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background-color 0.15s ease;
    }

    .diag-btn:hover {
      background-color: #0f172a;
    }

    #diagPanel {
      margin-top: 10px;
      display: none;
    }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: #4b5563;
      margin-bottom: 6px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #9ca3af;
    }

    .status-dot.online {
      background-color: #10b981;
      box-shadow: 0 0 6px rgba(16, 185, 129, 0.4);
    }

    .toolbar {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
    }

    .tool-btn {
      padding: 3px 8px;
      background-color: #e5e7eb;
      border: none;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      color: #374151;
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .tool-btn:hover {
      background-color: #d1d5db;
    }

    .console-box {
      background-color: #090d16;
      border: 1px solid #1e293b;
      border-radius: 6px;
      height: 180px;
      overflow-y: auto;
      padding: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 10.5px;
      line-height: 1.45;
      color: #e2e8f0;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .log-line {
      margin-bottom: 4px;
    }

    .log-time {
      color: #64748b;
      margin-right: 4px;
    }

    .log-info { color: #38bdf8; font-weight: 600; }
    .log-warn { color: #fbbf24; font-weight: 600; }
    .log-error { color: #f87171; font-weight: 600; }
    .log-text { color: #cbd5e1; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <span>NPTEL Whisperer</span>
    </div>
    <span class="version-badge">v2.0.0</span>
  </div>

  <div class="card">
    <div class="setting">
      <label for="autoSubmit">Auto-Submit</label>
      <input type="checkbox" id="autoSubmit">
    </div>
  </div>

  <button id="toggleDiagBtn" class="diag-btn">
    <span>Live Diagnostics & Logs</span>
    <span id="diagArrow">▼</span>
  </button>

  <div id="diagPanel">
    <div class="status-bar">
      <div class="status-badge">
        <span id="statusDot" class="status-dot"></span>
        <span id="statusText">Checking page...</span>
      </div>
      <div class="toolbar">
        <button id="copyLogsBtn" class="tool-btn" title="Copy to clipboard">Copy</button>
        <button id="clearLogsBtn" class="tool-btn" title="Clear logs">Clear</button>
        <button id="refreshBtn" class="tool-btn" title="Refresh">↻</button>
      </div>
    </div>

    <div id="consoleBox" class="console-box">Initializing diagnostics...</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
